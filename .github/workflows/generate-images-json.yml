name: Generate Images JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-images-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow geopy piexif gpxpy pandas

      - name: Generate images.json
        run: |
          python index_and_enrich.py

      - name: Verify thumbnails exist
        run: python .github/scripts/verify_thumbnails.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -z "$(git status --short -- images.json thumbs)" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add images.json thumbs
          git commit -m "Auto-generate images.json and thumbnails"
          git push
